background {
    monitor = DP-1
    path = /home/alba/.config/hypr/wallpapers/w3.jpg # only png supported for now
    # color = $color1

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $color6
    font_size = 150
    font_family = CaskaydiaMono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 200
    halign = center
    valign = center
}

# Today
label {
    monitor = DP-1
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A %d %b')" </big></b>"
    color = $color7
    font_size = 55
    font_family = CaskaydiaMono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 400
    halign = center
    valign = center
}
# User label
label {
    monitor = DP-1
    text = Bon Dia <span size="larger">Alba</span>
    color = $color6
    font_size = 45
    font_family = CaskaydiaMono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4
    position = 0, 0
    halign = center
    valign = center
}

