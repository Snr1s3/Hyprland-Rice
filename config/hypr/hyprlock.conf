background {
    monitor = DP-1
    path = /home/alba/.config/hypr/wallpapers/w3.jpg
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}
background {
    monitor = HDMI-A-1
    path = /home/alba/.config/hypr/wallpapers/w3.jpg
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $color6
    font_size = 150
    font_family = CaskaydiaMono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4
    position = 0, 200
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A %d %b')" </big></b>"
    color = $color7
    font_size = 55
    font_family = CaskaydiaMono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4
    position = 0, 400
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = Bon Dia <span size="larger">Alba</span>
    color = $color6
    font_size = 45
    font_family = CaskaydiaMono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4
    position = 0, 0
    halign = center
    valign = center
}
input-field {
    monitor = DP-1
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64 
    dots_center = true
    dots_rounding = -1
    font_color = $color7
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, 120
    halign = center
    valign = bottom
}